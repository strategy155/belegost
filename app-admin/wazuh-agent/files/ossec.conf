<!--
  Wazuh agent default configuration (Linux)

  Synthesized from what src/init/inst-functions.sh writes for a Linux
  agent install (client block, lines 355-375) and the enrollment block
  from src/init/register_configure_agent.sh (add_auto_enrollment).

  The <address>0.0.0.0</address> placeholder is replaced by
  `emerge --config` (the substitution src/init/replace_manager_ip.sh
  performs for the RPM flow); the <groups> element inside
  <enrollment> is where WAZUH_AGENT_GROUP lands upstream
  (register_configure_agent.sh line 372).
-->

<ossec_config>
  <client>
    <server>
      <address>0.0.0.0</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <crypto_method>aes</crypto_method>
    <notify_time>20</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <enrollment>
    <enabled>yes</enabled>
    <manager_address>0.0.0.0</manager_address>
    <port>1515</port>
    <delay_after_enrollment>20</delay_after_enrollment>
  </enrollment>
</ossec_config>
